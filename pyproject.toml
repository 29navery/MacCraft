[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maccraft"
version = "0.1.0"
description = "Experimental ARM64 Android Bedrock compatibility runtime for macOS"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}

[project.scripts]
maccraft = "maccraft.cli:main"

[tool.setuptools]
packages = ["maccraft"]
