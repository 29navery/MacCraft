name: Build and test MacCraft
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maccraft-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure, compile, and test
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure
  native-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native runner and install dependencies
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja openssl@3
      - name: Build MacCraft graphics probe and test package handling
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build/native
          ctest --test-dir build/native --output-on-failure
      - name: Build the patched native Bedrock compatibility runtime
        run: python3 scripts/build_runtime.py
      - name: Package developer build with executable permissions
        run: python3 scripts/package_developer.py
      - name: Upload developer build
        uses: actions/upload-artifact@v4
        with:
          name: MacCraft-arm64-developer
          path: dist/MacCraft-arm64-developer.tar.gz
          if-no-files-found: error
